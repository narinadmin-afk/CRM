<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CRM Logo</title>
  <desc id="desc">Modern CRM logo with customer network icon and upward growth arrow</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19BFFF"/>
      <stop offset="55%" stop-color="#1677E8"/>
      <stop offset="100%" stop-color="#2639D9"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D4BE8"/>
      <stop offset="100%" stop-color="#A14DFF"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(45 55)">
    <!-- cloud -->
    <path d="M245 210
             C238 158 198 126 151 126
             C123 126 98 137 80 158
             C68 151 54 148 39 148
             C10 148 -14 169 -18 197
             C-20 200 -20 205 -20 210
             C-20 246 9 275 45 275
             H239
             C275 275 304 246 304 210
             C304 178 282 153 252 148
             C250 170 248 190 245 210Z"
          fill="url(#blue)" opacity=".98"/>
    <!-- people -->
    <circle cx="142" cy="177" r="30" fill="#092F91"/>
    <path d="M93 246 C93 213 115 195 142 195 C169 195 191 213 191 246 Z" fill="#092F91"/>
    <circle cx="72" cy="193" r="22" fill="#0C8FEF"/>
    <path d="M38 246 C39 220 53 207 72 207 C84 207 95 214 101 226 C91 234 85 241 82 246 Z" fill="#0C8FEF"/>
    <circle cx="212" cy="193" r="22" fill="#0C8FEF"/>
    <path d="M202 226 C208 214 219 207 232 207 C251 207 265 220 266 246 H222 C218 239 211 233 202 226 Z" fill="#0C8FEF"/>

    <!-- growth arrow -->
    <path d="M28 284 C88 316 163 321 223 292 C250 279 272 259 292 234"
          fill="none" stroke="url(#purple)" stroke-width="20" stroke-linecap="round"/>
    <path d="M268 224 L307 207 L303 250 Z" fill="url(#purple)"/>
  </g>

  <!-- Wordmark -->
  <text x="365" y="230" font-family="Arial, Helvetica, sans-serif"
        font-size="170" font-weight="800" letter-spacing="4" fill="#123B78">CRM</text>

  <!-- Tagline -->
  <text x="370" y="292" font-family="Arial, Helvetica, sans-serif"
        font-size="27" font-weight="500" letter-spacing="8" fill="#667085">
    CUSTOMER RELATIONSHIP MANAGEMENT
  </text>
</svg>